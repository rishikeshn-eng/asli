[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "asli"
version = "0.1.0"
description = "Detect AI-generated and cloned speech in Indian languages; robust to phone and WhatsApp audio."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "onnxruntime>=1.17"]

[project.optional-dependencies]
train = ["torch", "torchaudio", "soundfile", "scikit-learn", "transformers", "edge-tts", "gTTS"]

[project.scripts]
asli = "asli.cli:main"

[tool.setuptools]
packages = ["asli"]

[tool.setuptools.package-data]
asli = ["data/*"]
